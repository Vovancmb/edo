services:
  edo:
    build: .
    container_name: edo-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - DATA_DIR=/data
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECURE=false
      - TRUST_PROXY=1
      - PUBLIC_URL=https://onlyoffice.a22mail.ru
    volumes:
      - edo-data:/data
      - ./public:/app/public:ro
      - ./server.js:/app/server.js:ro
      - ./db.js:/app/db.js:ro
      - ./crypto.js:/app/crypto.js:ro
      - ./package.json:/app/package.json:ro
    networks:
      - edo-net

volumes:
  edo-data:

networks:
  edo-net:
    driver: bridge
